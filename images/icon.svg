<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- lens -->
  <circle cx="112" cy="112" r="58" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="16"/>
  <!-- handle -->
  <line x1="155" y1="155" x2="206" y2="206" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- the "--" of a custom property -->
  <rect x="78" y="105" width="30" height="14" rx="7" fill="#ffffff"/>
  <rect x="116" y="105" width="30" height="14" rx="7" fill="#ffffff"/>
</svg>
